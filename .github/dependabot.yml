version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /explorer
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    # Astro check needs the TypeScript programmatic API. TypeScript 7 does not
    # provide that API yet. Keep compatible TypeScript 6 updates enabled.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
