name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, so a newly-published vulnerability surfaces without a push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA. Everything else runs through
# `run:` steps with explicitly pinned tool versions, so no step depends on a
# tag that can be moved underneath us.
jobs:
  # The 1.24 row is the one that matters most: it is the minimum the README
  # promises, and a go directive above it silently breaks those consumers.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24.x", "1.25.x", "1.26.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go build ./...
      - run: go test ./...

  race:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: "1.24.x" }
          - { os: ubuntu-latest, go: "1.26.x" }
          - { os: macos-latest, go: "1.26.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - run: golangci-lint run ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  # Module hygiene, including the four-way agreement between the go directive,
  # the README's stated minimum, and the oldest row of the test matrix. This is
  # the job that would have caught a go 1.26 directive on a v0.1.x release.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff
      - run: go mod verify
      - name: No replace or toolchain directives
        run: |
          ! grep -qE '^replace ' go.mod || { echo "go.mod carries a replace directive"; exit 1; }
          ! grep -qE '^toolchain ' go.mod || { echo "go.mod pins a toolchain"; exit 1; }
      - name: go directive matches the documented minimum and the matrix floor
        run: |
          declared=$(awk '/^go /{print $2}' go.mod)
          documented=$(grep -oE 'Requires Go [0-9]+\.[0-9]+' README.md | awk '{print $3}')
          matrix_min=$(grep -oE '"1\.[0-9]+\.x"' .github/workflows/ci.yml | sort -V | head -1 | tr -d '"' | sed 's/\.x$//')
          echo "go.mod=$declared README=$documented matrix-min=$matrix_min"
          test "$declared" = "$documented" || { echo "go.mod and README disagree"; exit 1; }
          test "$declared" = "$matrix_min" || { echo "go.mod and the CI matrix disagree"; exit 1; }

  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make cover

  # The README is executable: every command it advertises runs here, on all
  # three platforms, so the documentation cannot drift away from the behavior.
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/nicos-catalog version --expect "$(cat VERSION)"
      - name: Synthetic demo publishes three items and leaks none
        run: |
          go run ./cmd/nicos-catalog --json demo > demo.json
          test "$(jq '.projection.items | length' demo.json)" = "3"
          ! grep -q 'telemetry.private-sample' demo.json
      - name: README command sequence over the authored demo corpus
        run: |
          go run ./cmd/nicos-catalog --root . --corpus demo/catalog validate
          go run ./cmd/nicos-catalog --root . --corpus demo/catalog reindex
          go run ./cmd/nicos-catalog --root . --corpus demo/catalog search --limit 3 "ownership graph"
          go run ./cmd/nicos-catalog --root . --corpus demo/catalog graph
          go run ./cmd/nicos-catalog --root . --corpus demo/catalog drift
          go run ./cmd/nicos-catalog --root . --corpus demo/catalog --json project --visibility public --allow-hosts example.com

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz

  # A crash and allocation smoke only. Shared runners are far too noisy for a
  # timing assertion to carry any information.
  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make bench

  # The module promises deterministic output; the binary should be reproducible.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          go build -trimpath -o first ./cmd/nicos-catalog
          go clean -cache
          go build -trimpath -o second ./cmd/nicos-catalog
          sha256sum first second
          cmp first second
