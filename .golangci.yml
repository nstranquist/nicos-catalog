version: "2"

linters:
  default: standard
  enable:
    # errorlint catches the %s-instead-of-%w class directly. A formatted-but-
    # unwrapped error is invisible in review and silently defeats errors.Is.
    - errorlint
    - bodyclose
    - copyloopvar
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - thelper
    - tparallel
    - usestdlibvars
    - wastedassign
  settings:
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
  exclusions:
    rules:
      # Test fixtures deliberately construct malformed and hostile input.
      - path: _test\.go
        linters: [gosec, noctx]
      # Explorer and host collation write public catalog files at 0644/0755.
      - path: internal/explorer
        linters: [gosec]
      - path: internal/hostcollate
        linters: [gosec]
      - path: cmd/nicos-catalog/
        linters: [gosec]
      - path: internal/explorer
        linters: [revive, nilerr, noctx, staticcheck]
      - path: internal/hostcollate
        linters: [revive, nilerr, noctx]

formatters:
  enable:
    - gofmt
