  - react
  - explorer
  - developer-platform
  - software-catalog
  - local-first
  - oss
refs:
  - kind: adopted_by
    target: product.catalog-gallery
checks:
  - name: test
    command: [go, test, ./...]
  - name: vet
    command: [go, vet, ./...]
  - name: build
    command: [go, build, -o, /dev/null, ./cmd/nicos-catalog]
  - name: explorer
    command: [make, explorer-check]
  - name: embedded-assets
    command: [make, verify-explorer-embed]
  - name: publication
    command: [make, verify-publication]
description: Typed, host-injected software-catalog engine, read-only Explorer, static public export, and bounded MCP server.
