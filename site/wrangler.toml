# Nicos Catalog public documentation and Explorer shell.
# NDev supplies the account and credentials through the logical profile.
name = "nicos-catalog-explorer"
main = "worker.ts"
compatibility_date = "2026-08-21"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
